# Cab Books on Netlify: the site is already built, so there is no build step.
[build]
  publish = "web/public"
  functions = "netlify/functions"
  command = ""
  # Skip the build (saves credits) when a push only changes .md files (TODO.md, CLAUDE.md, README.md).
  # Netlify skips when this command exits 0, which git diff --quiet does when nothing else changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md'"
